name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Tests (parser, rules, validation, GitHub client, stubbed Bedrock, CLI)
        run: pytest -q
      - name: Eval gate (recall, false positives, safety invariants)
        run: python -m prreview.evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: artifacts/eval_report_offline.json
