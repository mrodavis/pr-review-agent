name: PR review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # only used when an AWS role is configured for Bedrock

jobs:
  review:
    # Fork PRs get a read-only token, so only review PRs from this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: AWS credentials through OIDC (no stored keys)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: ./
        with:
          mode: ${{ vars.AWS_ROLE_ARN != '' && 'bedrock' || 'rules' }}
