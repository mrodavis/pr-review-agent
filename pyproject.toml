[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-agent"
version = "1.0.0"
description = "An AI pull request reviewer: deterministic rules plus a Bedrock model review, anchored to changed lines, comments only, run as a GitHub Action."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "langchain-aws>=1.9",
  "langchain-core>=1.8",
  "boto3>=1.40",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pr-review = "prreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
